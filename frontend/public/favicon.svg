<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="240" />
    </clipPath>
  </defs>
  
  <!-- Outer Circular Background & Border like Vercel -->
  <circle cx="256" cy="256" r="248" fill="#000000" stroke="#3f3f46" stroke-width="16" />
  
  <!-- Hydra Logo Image inside circle -->
  <g clip-path="url(#circleClip)">
    <image href="/hydralogo.png" x="48" y="48" width="416" height="416" />
  </g>
</svg>