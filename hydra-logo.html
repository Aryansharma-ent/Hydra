<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydra Logo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .logo-container {
      padding: 40px;
    }
    .wordmark {
      margin-top: 24px;
      text-align: center;
    }
    .wordmark h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 12px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00d4ff, #7b2dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .wordmark p {
      margin-top: 8px;
      font-size: 14px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <svg width="320" height="320" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Glow filter -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <!-- Gradients -->
        <linearGradient id="serpentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00d4ff" />
          <stop offset="50%" stop-color="#7b2dff" />
          <stop offset="100%" stop-color="#ff006e" />
        </linearGradient>
        <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00d4ff" />
          <stop offset="100%" stop-color="#7b2dff" />
        </linearGradient>
        <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="100%" stop-color="#00d4ff" />
        </linearGradient>
      </defs>

      <!-- Outer orbit ring -->
      <circle cx="200" cy="200" r="160" stroke="url(#serpentGrad)" stroke-width="1" opacity="0.15" fill="none" />
      <circle cx="200" cy="200" r="140" stroke="url(#serpentGrad)" stroke-width="1" opacity="0.1" fill="none" />

      <!-- Core body / shared spine -->
      <path d="M 200 320
               C 200 320, 200 280, 200 260
               C 200 220, 180 200, 160 180
               C 140 160, 120 140, 120 120"
            stroke="url(#serpentGrad)" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glow)" />

      <!-- Left head (mythological serpent head) -->
      <g transform="translate(120, 120)">
        <!-- Neck continuation -->
        <path d="M 0 20 C -10 0, -20 -20, -15 -40" stroke="url(#headGrad)" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glow)" />
        <!-- Head shape -->
        <path d="M -15 -40 C -25 -60, -10 -80, 5 -85 C 20 -80, 35 -60, 25 -40 C 20 -30, 10 -25, 0 -20 Z"
              fill="url(#headGrad)" filter="url(#glow)" opacity="0.9" />
        <!-- Eye -->
        <circle cx="5" cy="-55" r="4" fill="url(#eyeGrad)" filter="url(#strongGlow)" />
        <!-- Fang -->
        <path d="M 15 -75 L 18 -65 L 12 -70 Z" fill="#ffffff" opacity="0.8" />
      </g>

      <!-- Right head -->
      <g transform="translate(200, 260) rotate(45)">
        <path d="M 0 0 C 10 -20, 20 -40, 15 -60" stroke="url(#headGrad)" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glow)" />
        <path d="M 15 -60 C 25 -80, 10 -100, -5 -105 C -20 -100, -35 -80, -25 -60 C -20 -50, -10 -45, 0 -40 Z"
              fill="url(#headGrad)" filter="url(#glow)" opacity="0.9" />
        <circle cx="-5" cy="-75" r="4" fill="url(#eyeGrad)" filter="url(#strongGlow)" />
        <path d="M -15 -95 L -18 -85 L -12 -90 Z" fill="#ffffff" opacity="0.8" />
      </g>

      <!-- Top right head -->
代步      <g transform="translate(260, 160) rotate(-30)">
        <path d="M 0 0 C 10 -20, 20 -40, 15 -60" stroke="url(#headGrad)" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glow)" />
        <path d="M 15 -60 C 25 -80, 10 -100, -5 -105 C -20 -100, -35 -80, -25 -60 C -20 -50, -10 -45, 0 -40 Z"
              fill="url(#headGrad)" filter="url(#glow)" opacity="0.9" />
        <circle cx="-5" cy="-75" r="4" fill="url(#eyeGrad)" filter="url(#strongGlow)" />
        <path d="M -15 -95 L -18 -85 L -12 -90 Z" fill="#ffffff" opacity="0.8" />
      </g>

      <!-- Central node / core -->
      <circle cx="200" cy="200" r="24" fill="url(#serpentGrad)" filter="url(#strongGlow)" opacity="0.95" />
      <circle cx="200" cy="200" r="12" fill="#0a0a0f" />
      <circle cx="200" cy="200" r="6" fill="#00d4ff" filter="url(#strongGlow)" />

      <!-- Data flow particles along the spines -->
      <circle cx="160" cy="180" r="3" fill="#00d4ff" filter="url(#glow)" opacity="0.9">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="140" cy="150" r="2.5" fill="#7b2dff" filter="url(#glow)" opacity="0.8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="230" cy="230" r="3" fill="#ff006e" filter="url(#glow)" opacity="0.9">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
      </circle>

      <!-- Subtle background aura -->
      <circle cx="200" cy="200" r="100" fill="url(#serpentGrad)" opacity="0.05" filter="url(#strongGlow)" />
    </svg>

    <div class="wordmark">
      <h1>Hydra</h1>
      <p>Multi-Force Intelligence</p>
    </div>
  </div>
</body>
</html>
